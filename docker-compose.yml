version: '3.8'

services:
  facilreports:
    build: .
    container_name: FacilReports
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./FacilReports/Reports:/app/Reports
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
